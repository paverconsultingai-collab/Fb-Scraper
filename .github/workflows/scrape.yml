name: Scrape FB Business Pages to Sheet

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: string
      start_index:
        description: 'Start index (0-based) for batch processing'
        required: false
        default: '0'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          SHEET_READ_URL: ${{ secrets.SHEET_READ_URL }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_TAB: ${{ vars.FB_SHEET_TAB }}
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
          DEBUG: ${{ github.event.inputs.debug }}
          START_INDEX: ${{ github.event.inputs.start_index || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run scrape
